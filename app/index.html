<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071a35">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>車両在庫を開く | 新生オート飯能</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Yu Gothic", sans-serif;
      background: #f4f7fb;
      color: #102642;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; }
    .shell {
      width: min(42rem, 100%);
      min-height: 100dvh;
      margin: auto;
      padding: max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      display: grid;
      align-content: center;
      gap: 20px;
    }
    .card {
      padding: clamp(24px, 7vw, 40px);
      border: 1px solid #d4dfed;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 14px 40px #10264212;
    }
    .brand { margin: 0 0 8px; color: #123f8c; font-size: .88rem; font-weight: 800; letter-spacing: .06em; }
    h1 { margin: 0; color: #071a35; font-size: clamp(1.55rem, 6vw, 2.2rem); line-height: 1.35; }
    p { line-height: 1.7; }
    .lead { margin: 16px 0 0; color: #34506f; }
    .help { margin: 20px 0 0; padding: 16px; border-radius: 12px; background: #edf4ff; color: #173d6e; }
    .help h2 { margin: 0; font-size: 1.05rem; }
    .help p { margin: 8px 0 0; }
    .fallback { margin: 20px 0 0; }
    .actions { display: grid; gap: 10px; }
    .launch-link {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 18px;
      border-radius: 10px;
      background: #123f8c;
      color: #fff;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      border: 0;
      font: inherit;
      cursor: pointer;
    }
    .launch-link:focus-visible { outline: 3px solid #78a7ed; outline-offset: 3px; }
    .note { margin: 12px 0 0; color: #60748d; font-size: .88rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="title">
      <p class="brand">新生オート飯能</p>
      <h1 id="title">車両在庫を開きます</h1>
      <p id="status" class="lead" aria-live="polite">この画面では自動で移動しません。下の手順で開いてください。</p>

      <section id="in-app-help" class="help" aria-labelledby="in-app-title">
        <h2 id="in-app-title">LINE WORKSから開く手順</h2>
        <p><strong>1.</strong> LINE WORKSの右上メニューから「ブラウザで開く」を選びます。</p>
        <p><strong>2.</strong> SafariまたはChromeへ切り替わったことを確認し、下のボタンを押します。</p>
      </section>

      <div class="fallback">
        <div class="actions">
          <a id="launch-link" class="launch-link" target="_top" href="https://shinsei-inventory-hanno.shimazaaaaaaa.chatgpt.site">在庫管理を開く</a>
        </div>
        <p class="note">ボタンを押す前に、LINE WORKSではなくSafariまたはChromeで表示していることを確認してください。</p>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const status = document.getElementById("status");

      function hasLineWorksQueryMarker(search) {
        try {
          return String(new URLSearchParams(search || "").get("userAgent") || "").trim().toLowerCase() === "lineworks";
        } catch (_) {
          return false;
        }
      }

      function isInAppWebView(userAgent, search) {
        const ua = String(userAgent || "");
        const explicitInApp = /line\s*works|works\s*mobile|naver/i.test(ua) || hasLineWorksQueryMarker(search);
        const androidWebView = /android/i.test(ua) && (
          /\bwv\b/i.test(ua) ||
          (/version\/4(?:\.0)?\b/i.test(ua) && /chrome\/\d+/i.test(ua) && /mobile/i.test(ua))
        );
        const iosWebView = /iphone|ipad|ipod/i.test(ua) && /applewebkit/i.test(ua) &&
          !/safari|crios|fxios|edgios|opios/i.test(ua);
        return explicitInApp || androidWebView || iosWebView;
      }

      function prepareLauncher() {
        if (isInAppWebView(navigator.userAgent, window.location.search)) {
          status.textContent = "先にLINE WORKSの右上メニューから「ブラウザで開く」を選んでください。";
          return;
        }
        status.textContent = "SafariまたはChromeで表示中です。下の「在庫管理を開く」を押してください。";
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", prepareLauncher, { once: true });
      } else {
        prepareLauncher();
      }
    })();
  </script>
</body>
</html>
